name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Metric checks
        run: |
          mkdir -p Build/Checks
          xcrun swiftc -swift-version 6 -strict-concurrency=complete -O \
            FreeRAMMac/MemoryMetrics.swift Tests/MemoryMetricsChecks.swift -o Build/Checks/MemoryMetricsChecks
          Build/Checks/MemoryMetricsChecks

      - name: Build universal Release
        run: |
          xcodebuild -project "Free RAM Mac.xcodeproj" -scheme "Free RAM Mac" \
            -configuration Release -derivedDataPath Build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build
          APP="$(find Build -path '*Release/Free RAM Mac.app' -maxdepth 6 | head -1)"
          codesign --verify --strict "$APP"
          lipo -info "$APP/Contents/MacOS/"*
          VERSION="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/Free-RAM-Mac-$VERSION.zip"
          shasum -a 256 dist/*.zip | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Free-RAM-Mac
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: .github/RELEASE_NOTES.md
