name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read version
        id: v
        run: |
          V=$(grep -m1 'MARKETING_VERSION = ' "Free RAM Mac.xcodeproj/project.pbxproj" | sed -E 's/.*= ([^;]+);/\1/')
          [[ "$V" == *.*.* ]] || V="$V.0"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checks (metrics, real purge request, login item)
        run: Tools/check.sh

      - name: Build universal Release
        run: |
          xcodebuild -project "Free RAM Mac.xcodeproj" -scheme "Free RAM Mac" \
            -configuration Release -derivedDataPath Build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build
          APP="$(find Build -path '*Release/Free RAM Mac.app' -maxdepth 6 | head -1)"
          codesign --verify --strict "$APP"
          lipo -info "$APP/Contents/MacOS/"*
          VERSION="${{ steps.v.outputs.version }}"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/Free-RAM-Mac-$VERSION.zip"
          shasum -a 256 dist/*.zip | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: Free-RAM-Mac
          path: dist/*

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Free RAM Mac ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body_path: .github/RELEASE_NOTES.md
